<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/style.css">
    <title>Novatech - Contact</title>
</head>
<body>
    <form action="">
        <label for="nom"></label>
        <input id="nom" name="nom" type="text"><br>

        <label for="email"></label>
        <input id="email" name="email" type="email"><br>
        
        <label for="sujet"></label>
        <select name="sujet" id="sujet">
            <option value="1">Retour produit</option>
            <option value="2">Réclamation</option>
            <option value="3">Demande Particulière</option>
        </select>
        <br>
        <label for="message">Message</label>
        <textarea name="message" id="message" cols="20" rows="30"></textarea>
        <br>
        <button type="submit">Envoyer</button>
                
    </form>
</body>
</html>
